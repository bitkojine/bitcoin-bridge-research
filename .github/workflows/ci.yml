name: honest

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install .
      - name: Validate domain and knowledge files
        run: python -m src.cli validate
      - name: Regenerate trees are identical (freshness)
        run: |
          python -m src.cli build && python -m src.build_web && python -m src.cli build-pdf
          git diff --exit-code -- dist/knowledge.js generated/market-map.md output/pdf/domain-map.pdf
      - name: Full test suite
        run: python -m unittest discover -s tests
      - name: Architecture document stays truthful (C4 contract)
        run: python -m unittest tests.test_artifacts.ArchitectureDocTests
